name: 功能建议
description: 提出新功能想法或对现有功能的改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。提交前请先搜索既有 issue，避免重复。

        请注意：本客户端是第三方实现，功能范围受上游公开接口能力限制。
        若你建议的功能依赖 IT之家官方接口并不对外提供的数据，可能无法实现。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过既有 issue，确认没有重复
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述当前的不便之处，而不是直接跳到解决方案
      placeholder: 每次查看 XX 时，我都需要 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望应用如何改动
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 资讯流 / 首页
        - 文章详情
        - 评论区
        - 圈子
        - 好物
        - 搜索
        - 直播
        - 账号
        - 外观 / 主题
        - 设置
        - 其他
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考实现、使用场景说明等
    validations:
      required: false
